[project]
name = "microcenter-cli"
version = "0.2.0"
description = "CLI/library for Micro Center catalog search, drill-down, and per-store stock/price"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "platformdirs>=4.2",
    "browser_cookie3>=0.19",
]

[project.optional-dependencies]
# Kept optional: mcp pulls in starlette/uvicorn/opentelemetry, which the plain CLI
# has no use for. `uv tool install --editable ".[mcp]"` to get `mcenter-mcp`.
mcp = ["mcp[cli]>=2.0"]

[project.scripts]
mcenter = "microcenter_cli.cli:main"
mcenter-mcp = "microcenter_cli.mcp_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microcenter_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["microcenter_cli/__init__.py:__version__"]
build_command = "pip install -q build && python -m build"
tag_format = "v{version}"
commit_parser = "conventional"  # feat: -> minor, fix:/perf: -> patch, `!`/BREAKING CHANGE -> major
# Matches the conventional-commit style already used in this repo's history --
# docs:/chore:/test:/ci:/refactor: intentionally do NOT trigger a release, only
# feat/fix/perf/breaking changes do. A baseline `v0.2.0` tag was set when this
# was adopted so version computation starts from there, not the entire
# pre-existing commit history.

[tool.semantic_release.branches.main]
match = "main"
