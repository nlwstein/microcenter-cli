[project]
name = "microcenter-cli"
version = "0.1.0"
description = "CLI/library for Micro Center catalog search, drill-down, and per-store stock/price"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "platformdirs>=4.2",
]

[project.scripts]
mcenter = "microcenter_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microcenter_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
