name: release

on:
  push:
    branches: [main]

permissions:
  contents: write   # semantic-release commits the version bump + tags + creates a GitHub Release
  id-token: write    # PyPI Trusted Publishing (OIDC) -- no API token stored/needed

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full history to compute the version bump

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Same test gate as test.yml, run again here so a release can never
      # happen on a broken build -- deliberately not just trusting that the
      # separate test.yml workflow already passed (cross-workflow triggers are
      # fragile; a self-contained gate in the same job is simpler and safer).
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[mcp]" ruff pytest
      - run: uv run ruff check microcenter_cli/ tests/
      - run: uv run pytest -q

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
