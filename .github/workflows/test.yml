name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # Ubuntu's system Python is PEP 668 "externally managed" -- unlike the
      # python:3.12-slim image .gitlab-ci.yml uses, --system install refuses
      # here. Use a real uv-managed venv instead.
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[mcp]" ruff pytest
      - run: uv run ruff check microcenter_cli/ tests/
      - run: uv run pytest -q
