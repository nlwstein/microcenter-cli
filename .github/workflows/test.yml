name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv pip install --system -e ".[mcp]" ruff pytest
      - run: ruff check microcenter_cli/ tests/
      - run: pytest -q
